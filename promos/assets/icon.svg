<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plugin Store icon, traced from src/icon.jpg. Rounded tile in a copper gradient, mark in #FEFEFE:
  a clasp purse with three coins showing through it.

  The mark is one path, traced from the JPEG's luminance channel (its chroma is 4:2:0 subsampled
  and traces wobbly). The coins are holes, not brown shapes, so the tile's gradient runs through
  them exactly as it does in the raster. The tile gradient and corner radius were measured from
  the raster after converting it from its display profile to sRGB.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Coin Purse">
  <defs>
    <linearGradient id="coinpurse-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E19F6D"/>
      <stop offset="1" stop-color="#92562E"/>
    </linearGradient>
  </defs>
